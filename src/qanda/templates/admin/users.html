{% extends "base.html" %}

{% block title %}Gestión de usuarios{% endblock %}

{% block content %}
<h1>Gestión de usuarios</h1>

<div class="table-wrapper" role="region" aria-label="Listado de usuarios" tabindex="0">
  <table class="users-table">
    <thead>
      <tr>
        <th scope="col">Email</th>
        <th scope="col">Rol</th>
        <th scope="col">Cambiar rol</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
        <tr>
          <td data-label="Email">{{ user.email }}</td>
          <td data-label="Rol">{{ role_labels.get(user.role, user.role) }}</td>
          <td data-label="Cambiar rol">
            <form method="post" action="{{ url_for('admin.cambiar_rol', user_id=user.id) }}">
              <label class="visually-hidden" for="role-{{ user.id }}">Rol de {{ user.email }}</label>
              <select id="role-{{ user.id }}" name="role">
                {% for role, label in role_labels.items() %}
                  <option value="{{ role }}" {% if role == user.role %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
              <button type="submit">Guardar</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
