{% extends "base.html" %}

{% block title %}Estrategia LLM del agente{% endblock %}

{% block content %}
<h1>Estrategia LLM del agente</h1>
<p>Estrategia actual: {{ current_strategy }}</p>

{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

<form method="post" action="{{ url_for('admin.configurar_estrategia') }}">
  <p>
    <label for="strategy">Proveedor de LLM</label>
    <select id="strategy" name="strategy" required>
      {% for value, label in strategies %}
      <option value="{{ value }}" {% if value == current_strategy %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </p>
  <button type="submit">Guardar estrategia</button>
</form>
{% endblock %}
