{% extends "base.html" %}

{% block title %}Gestión de usuarios{% endblock %}

{% block content %}
<h1>Gestión de usuarios</h1>

<table>
  <thead>
    <tr>
      <th>Email</th>
      <th>Rol</th>
      <th>Cambiar rol</th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
      <tr>
        <td>{{ user.email }}</td>
        <td>{{ role_labels.get(user.role, user.role) }}</td>
        <td>
          <form method="post"
                action="{{ url_for('admin.cambiar_rol', user_id=user.id) }}">
            <select name="role">
              {% for role, label in role_labels.items() %}
                <option value="{{ role }}" {% if role == user.role %}selected{% endif %}>
                  {{ label }}
                </option>
              {% endfor %}
            </select>
            <button type="submit">Guardar</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
