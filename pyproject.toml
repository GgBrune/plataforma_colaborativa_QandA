[project]
name = "plataforma-colaborativa-qanda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prisci23", email = "priurbano23@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.0.57",
]

[project.scripts]
plataforma-colaborativa-qanda = "plataforma_colaborativa_qanda:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
